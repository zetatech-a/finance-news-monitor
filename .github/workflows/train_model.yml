name: Train Relevance Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Train model
        run: python scripts/train_relevance.py

      - name: Commit model
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models/relevance.joblib
          git commit -m "Train relevance model" || echo "No changes"
          git push
