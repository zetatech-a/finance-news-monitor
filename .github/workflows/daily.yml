name: Daily Finance News Report (Daily)

concurrency:
  group: daily-finance-report-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "41 23 * * *"  # UTC 23:41 = KST 08:41
    - cron: "49 23 * * *"  # UTC 23:49 = KST 08:49
    - cron: "57 23 * * *"  # UTC 23:57 = KST 08:57
    - cron: "7 0 * * *"    # UTC 00:07 = KST 09:07
    - cron: "17 0 * * *"   # UTC 00:17 = KST 09:17
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email on manual run"
        type: boolean
        default: false
      force_send:
        description: "Allow manual email re-send when today's sent marker exists"
        type: boolean
        default: false
      wait_until_target:
        description: "Wait until about 08:55 KST on manual run"
        type: boolean
        default: false
      trigger_source:
        description: "워크플로 실행 요청 출처"
        required: false
        default: "manual"
        type: string
      scheduled_for:
        description: "외부 스케줄러 기준 실행 예정 UTC 시각"
        required: false
        type: string
      cron_expression:
        description: "외부 스케줄러가 사용한 Cron 표현식"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    # 리포트/sent marker를 main에 커밋·푸시하기 위한 최소 권한
    permissions:
      contents: write
    env:
      COLLECTION_END_HHMM: "0855"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Diagnostics
        env:
          # 자유 문자열 입력은 셸에 직접 보간하지 않는다. ${{ }}를 run 스크립트에
          # 끼워 넣으면 dispatch 권한만 있어도 `$(...)`로 임의 명령을 실행할 수
          # 있으므로, 값은 환경변수로 전달하고 아래에서 인용해 출력만 한다.
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          CRON_EXPRESSION: ${{ inputs.cron_expression }}
        run: |
          # 외부 스케줄러(Cloudflare Cron)에서 온 요청인지 로그로 확인할 수 있게 한다.
          # 민감정보는 출력하지 않는다.
          echo "Event: $GITHUB_EVENT_NAME"
          echo "inputs.trigger_source=$TRIGGER_SOURCE"
          echo "inputs.scheduled_for=$SCHEDULED_FOR"
          echo "inputs.cron_expression=$CRON_EXPRESSION"
          echo "inputs.send_email=${{ inputs.send_email }}"
          echo "inputs.force_send=${{ inputs.force_send }}"
          echo "inputs.wait_until_target=${{ inputs.wait_until_target }}"
          echo "workflow_run_id=$GITHUB_RUN_ID"
          echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          echo "github_sha=$GITHUB_SHA"
          date -u
          TZ=Asia/Seoul date

      - name: Pull latest reports and sent markers
        run: git pull --rebase origin main

      - name: Phase 5 marker precheck
        id: phase5_precheck
        run: |
          python scripts/phase5_delivery.py precheck \
            --event-name "$GITHUB_EVENT_NAME" \
            --send-email "${{ inputs.send_email }}" \
            --force-send "${{ inputs.force_send }}" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Wait until target send window
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: |
          python scripts/phase5_delivery.py wait \
            --event-name "$GITHUB_EVENT_NAME" \
            --wait-until-target "${{ inputs.wait_until_target }}" \
            --target-hhmm "$COLLECTION_END_HHMM" \
            --max-wait-seconds 1200

      - name: Re-pull latest reports and sent markers after wait
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: git pull --rebase origin main

      - name: Phase 5 marker recheck
        id: phase5_recheck
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: |
          python scripts/phase5_delivery.py precheck \
            --event-name "$GITHUB_EVENT_NAME" \
            --send-email "${{ inputs.send_email }}" \
            --force-send "${{ inputs.force_send }}" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Log skip reason
        if: ${{ steps.phase5_precheck.outputs.should_run != 'true' || steps.phase5_recheck.outputs.should_run != 'true' }}
        run: |
          echo "Phase 5 skip before wait: ${{ steps.phase5_precheck.outputs.skip_reason }}"
          echo "Phase 5 skip after wait: ${{ steps.phase5_recheck.outputs.skip_reason }}"
          echo "marker_path=${{ steps.phase5_precheck.outputs.marker_path }}"

      - name: Refresh candidate relevance model
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        run: |
          report_date="${{ steps.phase5_recheck.outputs.report_date }}"
          python scripts/refresh_relevance_candidate_model.py \
            --report-date "$report_date" \
            --candidates-dir reports/_candidates \
            --model-output models/relevance_candidate.joblib \
            --metrics-output "reports/_metrics/${report_date}_relevance_candidate_eval.json" \
            --report-output "reports/_metrics/${report_date}_relevance_candidate_eval.txt" \
            --disagreements-output "reports/_metrics/${report_date}_relevance_disagreements.csv" \
            --status-output "reports/_metrics/${report_date}_candidate_model_refresh.json" \
            --force \
            --best-effort

      - name: Run daily report
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        env:
          # NAVER API HUB (기존 Developers Center 키는 이관 후 무효)
          NCP_APIGW_API_KEY_ID: ${{ secrets.NCP_APIGW_API_KEY_ID }}
          NCP_APIGW_API_KEY: ${{ secrets.NCP_APIGW_API_KEY }}
          # Gemini 3줄 요약(선택). 미설정이면 추출식 요약으로 정상 생성된다 — 실패하지 않는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 아래 Repository Variables는 전부 선택이다. 미설정 시 빈 문자열이 전달되고,
          # src/config.py의 env_int/env_float가 빈 값을 "미설정"으로 보고 코드 기본값을 쓴다.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MAX_SUMMARIES: ${{ vars.GEMINI_MAX_SUMMARIES }}
          GEMINI_BATCH_MAX_ARTICLES: ${{ vars.GEMINI_BATCH_MAX_ARTICLES }}
          GEMINI_BATCH_MAX_INPUT_CHARS: ${{ vars.GEMINI_BATCH_MAX_INPUT_CHARS }}
          GEMINI_MAX_REQUESTS_PER_RUN: ${{ vars.GEMINI_MAX_REQUESTS_PER_RUN }}
          GEMINI_MAX_RECOVERY_REQUESTS: ${{ vars.GEMINI_MAX_RECOVERY_REQUESTS }}
          GEMINI_MAX_FETCH_ATTEMPTS: ${{ vars.GEMINI_MAX_FETCH_ATTEMPTS }}
          GEMINI_MIN_INTERVAL_SECONDS: ${{ vars.GEMINI_MIN_INTERVAL_SECONDS }}
        run: |
          echo "report_generation_started_kst=$(TZ='Asia/Seoul' date --iso-8601=seconds)"
          echo "collection_end_hhmm=$COLLECTION_END_HHMM"
          python -m src.run_daily \
            --date "${{ steps.phase5_recheck.outputs.report_date }}" \
            --window_hours 24 \
            --end_hhmm "$COLLECTION_END_HHMM" \
            --overlap_minutes 15

      - name: Email precheck
        id: email_precheck
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [[ "${{ steps.phase5_recheck.outputs.should_send }}" != "true" ]]; then
            echo "Email disabled by input or sent marker"
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          # secrets 미설정은 "발송 의도 없음"으로 보고 skip한다 — 예전처럼 exit 1로
          # 실패시키면 발송을 안 쓰는 저장소에서 매일 cron 5회가 전부 빨간불이 된다.
          # 대신 워크플로 Summary에 눈에 띄는 경고를 남긴다.
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Email skipped — missing secrets: ${missing[*]}"
            {
              echo "## ⚠️ 이메일 미발송"
              echo "다음 secrets가 설정되지 않아 발송을 건너뜁니다: ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_send=true" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: ${{ steps.email_precheck.outputs.should_send == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          # 리포트를 생성한 날짜를 그대로 전달 — 발송 시점에 자정(KST)을 넘겨도
          # 방금 만든 리포트가 정확히 첨부된다
          python -m src.notify_email --report-date "${{ steps.phase5_recheck.outputs.report_date }}"
          echo "email_sent_at_kst=$(TZ='Asia/Seoul' date --iso-8601=seconds)"

      - name: Write sent marker
        if: ${{ steps.email_precheck.outputs.should_send == 'true' }}
        run: |
          python scripts/phase5_delivery.py mark-sent \
            --report-date "${{ steps.phase5_recheck.outputs.report_date }}" \
            --event-name "$GITHUB_EVENT_NAME" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Prune old reports (retention policy)
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        continue-on-error: true
        run: |
          # 리포트 60일 보관 (index는 14일만 노출, 이메일은 당일만 첨부 — 기능 영향 없음.
          # _candidates/_metrics는 기본 90일 유지: 후보 모델 학습 lookback 21일용)
          python scripts/prune_reports.py \
            --reports-dir reports \
            --reference-date "${{ steps.phase5_recheck.outputs.report_date }}" \
            --report-keep-days 60

      - name: Commit reports and sent marker
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add reports/
          git commit -m "Daily report" || echo "No changes to commit"

          # 다른 실행/커밋과 경합할 수 있으므로 rebase+push를 재시도한다.
          # (기존 `git pull --rebase || true`는 충돌을 조용히 무시해 push가 그대로 실패했음)
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to push reports after 3 attempts" >&2
          exit 1
