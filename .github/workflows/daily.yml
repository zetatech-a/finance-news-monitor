name: Daily Finance News Report (Weekdays)

concurrency:
  group: daily-finance-news
  cancel-in-progress: false

on:
  schedule:
    - cron: "5 0 * * 1-5"  # UTC Mon-Fri 00:05 = KST Mon-Fri 09:05
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily (naver)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m src.run_daily --window_hours 24 --end_hhmm 0900 --overlap_minutes 15

      - name: Send email (optional)
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify_email

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 변경사항(리포트) 먼저 stage
          git add reports/

          # 변경사항이 있으면 커밋 (없으면 그냥 넘어감)
          git commit -m "Daily report" || echo "No changes to commit"

          # 원격 최신 반영 (충돌 방지)
          git pull --rebase origin main || true

          # push (rebase로 커밋 해시가 바뀌었을 수 있으니 다시 push)
          git push origin HEAD:main
