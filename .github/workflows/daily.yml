name: Daily Finance News Report (Daily)

concurrency:
  group: daily-finance-news
  cancel-in-progress: true

on:
  schedule:
    - cron: "33 23 * * *"  # UTC daily 23:33 = KST daily 08:33
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email on manual run"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Diagnostics
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "inputs.send_email=${{ inputs.send_email }}"
          date -u
          TZ=Asia/Seoul date

      - name: Run daily 1st pass (baseline window)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m src.run_daily --date "$(TZ='Asia/Seoul' date +%Y-%m-%d)" --window_hours 24 --end_hhmm 0820 --overlap_minutes 15

      - name: Run daily 2nd pass (catch-up before send)
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m src.run_daily --date "$(TZ='Asia/Seoul' date +%Y-%m-%d)" --window_hours 24 --end_hhmm 0830 --overlap_minutes 15

      - name: Email precheck
        id: email_precheck
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          want_send="${{ github.event_name == 'schedule' || inputs.send_email }}"

          if [[ "$want_send" != "true" ]]; then
            echo "Email disabled by input"
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

          echo "should_send=true" >> "$GITHUB_OUTPUT"

      - name: Send email (optional)
        if: ${{ steps.email_precheck.outputs.should_send == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify_email

      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 변경사항(리포트) 먼저 stage
          git add reports/

          # 변경사항이 있으면 커밋 (없으면 그냥 넘어감)
          git commit -m "Daily report" || echo "No changes to commit"

          # 원격 최신 반영 (충돌 방지)
          git pull --rebase origin main || true

          # push (rebase로 커밋 해시가 바뀌었을 수 있으니 다시 push)
          git push origin HEAD:main
