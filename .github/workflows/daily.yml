name: Daily Finance News Report (Daily)

concurrency:
  group: daily-finance-report-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "41 23 * * *"  # UTC 23:41 = KST 08:41
    - cron: "49 23 * * *"  # UTC 23:49 = KST 08:49
    - cron: "57 23 * * *"  # UTC 23:57 = KST 08:57
    - cron: "7 0 * * *"    # UTC 00:07 = KST 09:07
    - cron: "17 0 * * *"   # UTC 00:17 = KST 09:17
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email on manual run"
        type: boolean
        default: false
      force_send:
        description: "Allow manual email re-send when today's sent marker exists"
        type: boolean
        default: false
      wait_until_target:
        description: "Wait until about 08:55 KST on manual run"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      COLLECTION_END_HHMM: "0855"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Diagnostics
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "inputs.send_email=${{ inputs.send_email }}"
          echo "inputs.force_send=${{ inputs.force_send }}"
          echo "inputs.wait_until_target=${{ inputs.wait_until_target }}"
          echo "workflow_run_id=$GITHUB_RUN_ID"
          echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
          echo "github_sha=$GITHUB_SHA"
          date -u
          TZ=Asia/Seoul date

      - name: Pull latest reports and sent markers
        run: git pull --rebase origin main

      - name: Phase 5 marker precheck
        id: phase5_precheck
        run: |
          python scripts/phase5_delivery.py precheck \
            --event-name "$GITHUB_EVENT_NAME" \
            --send-email "${{ inputs.send_email }}" \
            --force-send "${{ inputs.force_send }}" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Wait until target send window
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: |
          python scripts/phase5_delivery.py wait \
            --event-name "$GITHUB_EVENT_NAME" \
            --wait-until-target "${{ inputs.wait_until_target }}" \
            --target-hhmm "$COLLECTION_END_HHMM" \
            --max-wait-seconds 1200

      - name: Re-pull latest reports and sent markers after wait
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: git pull --rebase origin main

      - name: Phase 5 marker recheck
        id: phase5_recheck
        if: ${{ steps.phase5_precheck.outputs.should_run == 'true' }}
        run: |
          python scripts/phase5_delivery.py precheck \
            --event-name "$GITHUB_EVENT_NAME" \
            --send-email "${{ inputs.send_email }}" \
            --force-send "${{ inputs.force_send }}" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Log skip reason
        if: ${{ steps.phase5_precheck.outputs.should_run != 'true' || steps.phase5_recheck.outputs.should_run != 'true' }}
        run: |
          echo "Phase 5 skip before wait: ${{ steps.phase5_precheck.outputs.skip_reason }}"
          echo "Phase 5 skip after wait: ${{ steps.phase5_recheck.outputs.skip_reason }}"
          echo "marker_path=${{ steps.phase5_precheck.outputs.marker_path }}"

      - name: Refresh candidate relevance model
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        run: |
          report_date="${{ steps.phase5_recheck.outputs.report_date }}"
          python scripts/refresh_relevance_candidate_model.py \
            --report-date "$report_date" \
            --candidates-dir reports/_candidates \
            --model-output models/relevance_candidate.joblib \
            --metrics-output "reports/_metrics/${report_date}_relevance_candidate_eval.json" \
            --report-output "reports/_metrics/${report_date}_relevance_candidate_eval.txt" \
            --disagreements-output "reports/_metrics/${report_date}_relevance_disagreements.csv" \
            --status-output "reports/_metrics/${report_date}_candidate_model_refresh.json" \
            --force \
            --best-effort

      - name: Run daily report
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          echo "report_generation_started_kst=$(TZ='Asia/Seoul' date --iso-8601=seconds)"
          echo "collection_end_hhmm=$COLLECTION_END_HHMM"
          python -m src.run_daily \
            --date "${{ steps.phase5_recheck.outputs.report_date }}" \
            --window_hours 24 \
            --end_hhmm "$COLLECTION_END_HHMM" \
            --overlap_minutes 15

      - name: Email precheck
        id: email_precheck
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [[ "${{ steps.phase5_recheck.outputs.should_send }}" != "true" ]]; then
            echo "Email disabled by input or sent marker"
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_TO; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

          echo "should_send=true" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: ${{ steps.email_precheck.outputs.should_send == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m src.notify_email
          echo "email_sent_at_kst=$(TZ='Asia/Seoul' date --iso-8601=seconds)"

      - name: Write sent marker
        if: ${{ steps.email_precheck.outputs.should_send == 'true' }}
        run: |
          python scripts/phase5_delivery.py mark-sent \
            --report-date "${{ steps.phase5_recheck.outputs.report_date }}" \
            --event-name "$GITHUB_EVENT_NAME" \
            --collection-end-hhmm "$COLLECTION_END_HHMM"

      - name: Commit reports and sent marker
        if: ${{ steps.phase5_recheck.outputs.should_run == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add reports/
          git commit -m "Daily report" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
